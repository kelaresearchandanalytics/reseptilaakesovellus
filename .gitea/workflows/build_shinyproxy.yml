name: Build and Push Docker Image
run-name: ${{ gitea.actor }} is testing out Gitea Actions 
on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # Use self-hosted runner label specific to your Gitea setup
    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4  # Gitea can use GitHub actions, or specify a Gitea-hosted alternative

      # Build and push the Docker image
      - name: Build and push Docker image
        run: |
          docker build -t 192.168.1.112:5000/reseptilaakesovellus:latest -f Dockerfile_shinyproxy .
          docker push 192.168.1.112:5000/reseptilaakesovellus:latest
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
          DOCKER_INSECURE_SKIP_TLS_VERIFY: "true"  # For insecure registry
